name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build and test
        run: |
          set -o pipefail
          DESTINATION_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data = json.load(sys.stdin); ids = [device["udid"] for runtime, devices in data["devices"].items() if "SimRuntime.iOS" in runtime for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPad")]; print(ids[0] if ids else "")')"
          if [ -z "$DESTINATION_ID" ]; then
            echo "No available iPad simulator found."
            exit 1
          fi
          xcodebuild \
            -project NightPDF.xcodeproj \
            -scheme NightPDF \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${DESTINATION_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            clean test

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NightPDF-test-output
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
